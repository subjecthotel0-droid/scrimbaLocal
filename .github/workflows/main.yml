name: Auto Sync with Upstream

on:
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  sync:
    runs-on: ubuntu-latest # Runs on Linux, avoiding Windows path limits
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated to v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/scrimba/learn-fullstack-development.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Merge Upstream
        run: |
          git merge upstream/main --allow-unrelated-histories -X theirs
          # If the original repo uses 'master', change 'upstream/main' to 'upstream/master'

      - name: Push Changes
        run: git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
